<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hora da Tarefa — ícone">
  <title>Hora da Tarefa</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- folha da tarefa -->
  <rect x="150" y="104" width="212" height="280" rx="28" fill="#FFFFFF"/>
  <path d="M322 104 H362 V144 Z" fill="#BFDBFE"/>
  <path d="M322 104 H362 V144" fill="none" stroke="#93C5FD" stroke-width="6" stroke-linejoin="round"/>
  <!-- selo relógio (a Hora) -->
  <circle cx="256" cy="168" r="38" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="256" y1="168" x2="256" y2="146" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="256" y1="168" x2="271" y2="176" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="168" r="7" fill="#FFFFFF"/>
  <!-- linhas do enunciado -->
  <rect x="178" y="228" width="156" height="22" rx="11" fill="#DBEAFE"/>
  <rect x="178" y="264" width="156" height="22" rx="11" fill="#DBEAFE"/>
  <rect x="178" y="300" width="110" height="22" rx="11" fill="#DBEAFE"/>
  <rect x="178" y="336" width="72" height="22" rx="11" fill="#22C55E"/>
  <!-- selo concluído (a Tarefa feita) -->
  <circle cx="330" cy="342" r="90" fill="#22C55E" stroke="#FFFFFF" stroke-width="18"/>
  <path d="M288 342 l30 30 l62 -70" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
